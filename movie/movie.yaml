openapi: 3.0.3
info:
  title: Movie Service API
  description: API for consulting and managing the movie catalogue.
  version: "2.0.0"
  contact:
    name: Helene Coullon
    url: https://helene-coullon.fr/
    email: helene.coullon@imt-atlantique.fr
servers:
  - url: http://localhost:3200
    description: Local development server

tags:
  - name: catalogue
    description: Operations for browsing movies
  - name: administration
    description: Operations requiring administrator rights
  - name: documentation
    description: API documentation

paths:
  /:
    get:
      tags: [documentation]
      summary: Service home page
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string
              example: "<h1 style='color:blue'>Welcome to the Movie service!</h1>"

  /openapi.yaml:
    get:
      tags: [documentation]
      summary: Retrieve the OpenAPI specification
      description: Returns this document so it can be loaded by an OpenAPI client or viewer.
      responses:
        "200":
          description: OpenAPI specification
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: Specification file is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /movies:
    get:
      tags: [catalogue]
      summary: List movies
      description: Returns all movies, optionally filtered by director, title, and minimum rating.
      security:
        - bearerAuth: []
      parameters:
        - name: director
          in: query
          description: Case-insensitive partial match on the director's name.
          schema:
            type: string
        - name: title
          in: query
          description: Case-insensitive partial match on the movie title.
          schema:
            type: string
        - name: min_rating
          in: query
          description: Only return movies whose rating is greater than or equal to this value.
          schema:
            type: number
            format: float
      responses:
        "200":
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Movie"
        "400":
          description: Invalid minimum rating
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [administration]
      summary: Add a movie
      description: Creates a movie and generates its UUID.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
      responses:
        "201":
          description: Movie added successfully
          content:
            application/json:
              schema:
                type: object
                required: [message, movie]
                properties:
                  message:
                    type: string
                    example: Movie added
                  movie:
                    $ref: "#/components/schemas/Movie"
        "400":
          description: Invalid JSON or missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /movies/{movieid}:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    get:
      tags: [catalogue]
      summary: Retrieve a movie by ID
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Movie found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    put:
      tags: [administration]
      summary: Update a movie
      description: Replaces the editable fields of an existing movie.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovieInput"
      responses:
        "200":
          description: Movie updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "400":
          description: Invalid JSON or missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    delete:
      tags: [administration]
      summary: Delete a movie
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Movie deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Movie"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Movie ID not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MovieId:
      name: movieid
      in: path
      required: true
      description: Unique identifier of the movie.
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Missing, invalid, expired, or insufficient authorization token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Movie:
      type: object
      description: Representation of a movie.
      required: [id, title, director, rating]
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the movie.
          example: 720d006c-3a57-4b6a-b18f-9b713b073f3c
        title:
          type: string
          description: Movie title.
          example: The Good Dinosaur
        director:
          type: string
          description: Movie director.
          example: Peter Sohn
        rating:
          type: number
          format: float
          description: Movie rating.
          example: 7.4

    MovieInput:
      type: object
      required: [title, director, rating]
      properties:
        title:
          type: string
          example: The Good Dinosaur
        director:
          type: string
          example: Peter Sohn
        rating:
          type: number
          format: float
          example: 7.4

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: Movie ID not found
