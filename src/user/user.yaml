openapi: 3.0.3

info:
  title: User Service API
  description: API for authenticating and managing users.
  version: "1.0.0"
  contact:
    name: Helene Coullon
    url: https://helene-coullon.fr/
    email: helene.coullon@imt-atlantique.fr

servers:
  - url: http://localhost:3203
    description: Local development server

tags:
  - name: authentication
    description: Operations for user authentication
  - name: users
    description: Operations for managing user profiles
  - name: administration
    description: Operations requiring administrator rights
  - name: documentation
    description: API documentation

paths:
  /:
    get:
      tags: [documentation]
      summary: Service home page
      responses:
        "200":
          description: HTML welcome message
          content:
            text/html:
              schema:
                type: string
              example: "<h1 style='color:blue'>Welcome to the User service!</h1>"

  /openapi.yaml:
    get:
      tags: [documentation]
      summary: Retrieve the OpenAPI specification
      description: Returns this document so it can be loaded by an OpenAPI client or viewer.
      responses:
        "200":
          description: OpenAPI specification
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: Specification file is not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /login:
    post:
      tags: [authentication]
      summary: Authenticate a user
      description: Validates a user ID and returns a signed JWT token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                required: [message, token]
                properties:
                  message:
                    type: string
                    example: Login successful
                  token:
                    type: string
                    description: JWT bearer token
        "400":
          description: Missing user ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users:
    get:
      tags: [administration]
      summary: List all users
      description: Returns all registered users. Requires administrator rights.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [administration]
      summary: Create a user
      description: Registers a new user. Requires administrator rights.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/User"
      responses:
        "201":
          description: User added successfully
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message:
                    type: string
                    example: User added
                  user:
                    $ref: "#/components/schemas/User"
        "400":
          description: Invalid payload, missing required field, or user ID already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"

    put:
      tags: [users]
      summary: Update a user
      description: Updates an existing user's name and last_active fields.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateInput"
      responses:
        "201":
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                required: [message, user]
                properties:
                  message:
                    type: string
                    example: User updated
                  user:
                    $ref: "#/components/schemas/UserUpdateInput"
        "400":
          description: Invalid payload or missing required field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /users/{user_id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    delete:
      tags: [users]
      summary: Delete a user
      description: Deletes a user account. Allowed for administrators or the user themselves.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    example: User deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: Unique identifier of the user.
      schema:
        type: string
        example: chris_rivers

  responses:
    Unauthorized:
      description: Missing, invalid, expired, or insufficient authorization token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    LoginInput:
      type: object
      required: [id]
      properties:
        id:
          type: string
          description: Unique identifier of the user.
          example: chris_rivers

    User:
      type: object
      required: [id, name, last_active, admin]
      properties:
        id:
          type: string
          description: Unique identifier of the user.
          example: chris_rivers
        name:
          type: string
          description: Full name of the user.
          example: Chris Rivers
        last_active:
          type: integer
          description: Last active timestamp.
          example: 1360031010
        admin:
          type: boolean
          description: Whether the user has administrator privileges.
          example: false

    UserUpdateInput:
      type: object
      required: [id, name, last_active]
      properties:
        id:
          type: string
          description: Unique identifier of the user.
          example: chris_rivers
        name:
          type: string
          description: Full name of the user.
          example: Chris Rivers
        last_active:
          type: integer
          description: Last active timestamp.
          example: 1360031010

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: User not found